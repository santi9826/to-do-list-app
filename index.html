<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>To-do List</h1>
        </header>
        <div class="containerText">
            <input type="text" id="taskbox" placeholder="What do you need to do?">
            <button type="submit" id="submit" onclick="task()">Add</button>
        </div>
        <div class="taskbar">
            <ul>
                <li><a href="" target=_self><div id="all">All</div></a></li>
                <li><a href="" target=_self><div id="active">Active</div></a></li>
                <li><a href="" target=_self><div id="completed">Completed</div></a></li>
            </ul>
        </div>
        <div class="taskcontainer">
            <div class="tasklist"><p id="task1"></p></div>
            <div class="tasklist"><p id="task2"></p></div>
            <div class="tasklist"><p id="task3"></p></div>
            <div class="tasklist"><p id="task4"></p></div>
            <div class="tasklist"><p id="task5"></p></div>
            <div class="tasklist"><p id="task6"></p></div>
            <div class="tasklist"><p id="task7"></p></div>
            <div class="tasklist"><p id="task8"></p></div>
            <div class="tasklist"><p id="task9"></p></div>
            <div class="tasklist"><p id="task10"></p></div>
            <div class="tasklist">
            </div>
        </div>

    </div>
    <script src="index.js"></script>
</body>
</html>
