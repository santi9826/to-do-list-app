<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>To-do List</h1>
        </header>
    
        <input type="text" id="taskbox" placeholder="What do you need to do?">
        <button type="submit" id="submit">Add</button>

        <div class="taskbar">
            <div id="all">All</div>
            <div id="active">Active</div>
            <div id="completed">Completed</div>
        </div>
        <div class="taskcontainer">
            <div class="tasklist" id="task1"></div>
            <div class="tasklist" id="task2"></div>
            <div class="tasklist" id="task3"></div>
            <div class="tasklist" id="task4"></div>
            <div class="tasklist" id="task5"></div>
            <div class="tasklist" id="task6"></div>
            <div class="tasklist" id="task7"></div>
            <div class="tasklist" id="task8"></div>
            <div class="tasklist" id="task9"></div>
            <div class="tasklist" id="task10"></div>
            <div class="tasklist">

            </div>
        </div>

    </div>
    <script src="index.js"></script>
</body>
</html>
